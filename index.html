<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎光臨</title>
    <style>
        /* 基礎樣式清除與置中 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        /* 限制手機觀看寬度，避免電腦版螢幕過大 */
        .container {
            max-width: 500px; 
            width: 100%;
            text-align: center;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* 照片樣式：自動適應寬度 */
        .main-photo {
            width: 100%;
            height: auto;
            display: block;
        }

        /* LINE 按鈕容器：讓按鈕保持在畫面中下方 */
        .btn-container {
            padding: 30px 20px;
            margin-top: auto; /* 將按鈕推至底部，確保不遮擋照片文字 */
        }

        /* LINE 經典綠色按鈕 */
        .line-btn {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            padding: 16px 0;
            background-color: #06C755; 
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px; 
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
            transition: all 0.2s ease;
        }

        /* 點擊時的縮放與深色回饋效果 */
        .line-btn:active {
            transform: scale(0.96);
            background-color: #05b34c;
            box-shadow: 0 2px 6px rgba(6, 199, 85, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 主照片 -->
        <img class="main-photo" src="index.html.jpg" alt="主視覺照片">
        
        <!-- LINE 按鈕區 -->
        <div class="btn-container">
            <a href="https://line.me/ti/p/uDrzEd2crq" class="line-btn">點此加入 LINE 聯絡</a>
        </div>
    </div>

</body>
</html>
