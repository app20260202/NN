<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎光臨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .container {
            max-width: 500px; 
            width: 100%;
            text-align: center;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        /* 照片區域：讓所有照片寬度一致、垂直排列，無縫隙 */
        .photo-gallery {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .main-photo {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
        }

        /* LINE 按鈕區：加上隱藏墊高，確保最後一張照片不會被按鈕蓋到 */
        .btn-container {
            padding: 30px 20px;
            background: #ffffff;
            position: sticky;
            bottom: 0; /* 讓按鈕固定在手機螢幕最下方，方便隨時點擊 */
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
        }

        .line-btn {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            padding: 16px 0;
            background-color: #06C755; 
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px; 
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
            transition: all 0.2s ease;
        }

        .line-btn:active {
            transform: scale(0.96);
            background-color: #05b34c;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 照片藝廊：要在引號內換上你真正的照片名稱 -->
        <div class="photo-gallery">
            <img class="main-photo" src="index.html" alt="照片 1">
            <img class="main-photo" src="index2.html" alt="照片 2">
        </div>
        
        <!-- LINE 固定按鈕區 -->
        <div class="btn-container">
            <a href="https://line.me/ti/p/uDrzEd2crq" class="line-btn">點此加入 LINE 聯絡</a>
        </div>
    </div>

</body>
</html>
